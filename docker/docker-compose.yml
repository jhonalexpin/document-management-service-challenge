services:
  postgresql:
    container_name: postgresql_container
    image: bitnami/postgresql:latest
    ports:
      - "5432:5432"
    networks:
      - batch_network
    volumes:
      - challenge_postgresql_data:/bitnami/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d
    env_file:
      - ../.env.dev
    environment:
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME_PROP}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD_PROP}
      POSTGRESQL_DATABASE: ${POSTGRESQL_POSTGRES_DATABASE}
      POSTGRESQL_POSTGRES_PASSWORD: ${POSTGRESQL_POSTGRES_PASSWORD_PROP} # Password of user "postgres"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRESQL_PASSWORD} pg_isready -U ${POSTGRESQL_USERNAME} -d ${POSTGRESQL_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # MinIO Web Console
    networks:
      - batch_network
    env_file:
      - ../.env.dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER_PROP}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD_PROP}
    command: server --console-address ":9001" /data
    volumes:
      - challenge_minio_data:/data
  # Include all the necessary settings to include a document management service in the stack
  # Remember to configure this service to limit the memory to 50MB
  document-management-service:
    platform: linux/amd64 # Change to linux/arm64 if you are on an M1/M2/M3 Mac
    build:
      context: ../
      shm_size: '6gb' # Give the builder more shared memory
    env_file:
      - ../.env.dev
    ports:
      - "8080:8080" # Expose the application port
    networks:
      - batch_network
    depends_on:
      postgresql:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      # --- Database Credentials ---
      - MINIO_URL=http://minio:9000
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgresql:5432/challenge
      - SPRING_R2DBC_USERNAME=challenge_user
      - SPRING_R2DBC_PASSWORD=password123
    deploy:
      resources:
        limits:
          memory: 50M

volumes:
  challenge_postgresql_data:
    driver: local
  challenge_minio_data:
    driver: local

networks:
  batch_network:
    driver: bridge
